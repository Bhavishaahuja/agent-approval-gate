[project]
name = "agent-approval-gate"
version = "0.0.1"
description = "Human approval for AI agent tool calls without approval fatigue. A Python decorator with risk tiers, previews and an audit log. Works with any framework."
readme = "README.md"
license = "MIT"
authors = [{ name = "Bhavisha Ahuja", email = "bhavishaahuja800@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["human-in-the-loop", "ai-agents", "agent-safety", "tool-calling", "approval-workflow", "llm", "python-decorator", "guardrails", "agentic-ai", "audit-log"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-approval-gate = "agent_approval_gate.cli:main"

[project.urls]
Homepage = "https://github.com/Bhavishaahuja/agent-approval-gate"
Issues = "https://github.com/Bhavishaahuja/agent-approval-gate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_approval_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
